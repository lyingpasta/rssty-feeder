[package]
name = "rss-feeder"
version = "0.1.0"
edition = "2024"

[dependencies]
rss = "2.0"
reqwest = { version = "0.11", features = ["blocking"] }
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
html2text = "0.12"
image = "0.24"
viuer = "0.7"
anyhow = "1.0"
dirs = "5.0"
